name: AgentWidgetLab
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
targets:
  AgentWidgetLab:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.AgentWidgetLab
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        CODE_SIGN_ENTITLEMENTS: App/AgentWidgetLab.entitlements
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: AgentWidgetExtension
  AgentWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.AgentWidgetLab.Widgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        CODE_SIGN_ENTITLEMENTS: Widget/AgentWidgetExtension.entitlements
        TARGETED_DEVICE_FAMILY: "1"
